<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | OmniConvert</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  
  <style>
    :root {
      --bg: #000000;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .error-card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: clamp(24px, 4vw, 48px);
      background: #1e222e;
      box-shadow: 9px 9px 18px #14171f, -9px -9px 18px #282d3d;
      border-radius: clamp(16px, 2vw, 28px);
      width: min(92vw, 560px);
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(4rem, 10vw, 6.5rem);
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
    }
    h2 { font-size: clamp(1.2rem, 3vw, 1.6rem); margin-bottom: 12px; font-weight: 700; }
    p { color: var(--muted); font-size: clamp(0.85rem, 1.8vw, 1rem); margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: clamp(10px, 2vw, 14px) clamp(20px, 3vw, 28px);
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 700;
      border-radius: 50px;
      box-shadow: 6px 6px 16px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>
  <div id="cursorDot" class="cursor-dot"></div>
  <div id="cursorRing" class="cursor-ring"></div>

  <div class="error-card">
    <h1>404</h1>
    <h2>Lost in Format Space</h2>
    <p>The page or converter route you are looking for seems to have disintegrated into unformatted bits.</p>
    <a href="/" class="btn"><i data-feather="arrow-left"></i> Return to OmniConvert</a>
  </div>

  <script>
    if (typeof feather !== 'undefined') {
      feather.replace();
    }

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    const tags = ['PDF', 'DOCX', 'PNG', 'JPG', 'WEBP', 'JSON', 'MP3', 'ZIP', 'CSV', 'YAML', 'SVG', '404'];
    const particles = [];

    function createParticles() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      
      const area = width * height;
      const count = Math.min(130, Math.max(30, Math.floor(area / 20000)));

      particles.length = 0;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2,
          size: Math.random() * 14 + 10,
          text: tags[Math.floor(Math.random() * tags.length)],
          opacity: Math.random() * 0.45 + 0.15
        });
      }
    }

    window.addEventListener('resize', createParticles);
    createParticles();

    let mouse = { x: -1000, y: -1000 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          p.x -= (dx / dist) * 2;
          p.y -= (dy / dist) * 2;
        }

        ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`;
        ctx.font = `${p.size}px 'JetBrains Mono', monospace`;
        ctx.fillText(p.text, p.x, p.y);
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
