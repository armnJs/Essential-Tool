<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | OmniConvert</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
    }

    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .error-card {
      position: relative;
      z-index: 10;
      background: var(--bg-card);
      backdrop-filter: var(--glass-backdrop);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 3.5rem 3rem;
      text-align: center;
      max-width: 540px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.6s ease forwards;
    }

    .error-code {
      font-size: 7rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .error-msg {
      color: var(--text-secondary);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .home-btn {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      padding: 0.9rem 2rem;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>

<body>
  <canvas id="particleCanvas"></canvas>
  <div id="cursorDot" class="cursor-dot"></div>
  <div id="cursorRing" class="cursor-ring"></div>

  <div class="error-card">
    <div class="error-code">404</div>
    <h2 class="error-title">Lost in Conversion Space</h2>
    <p class="error-msg">The file format or route you requested seems to have disintegrated into unformatted bits.</p>
    <a href="/" class="home-btn">
      <i data-feather="arrow-left"></i> Return to OmniConvert
    </a>
  </div>

  <script>
    feather.replace();

    // Floating File Particle Physics Simulation
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const tags = ['PDF', 'DOCX', 'PNG', 'JPG', 'WEBP', 'JSON', 'MP3', 'ZIP', 'CSV', 'YAML', 'SVG', '404'];
    const particles = [];

    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        size: Math.random() * 14 + 10,
        text: tags[Math.floor(Math.random() * tags.length)],
        opacity: Math.random() * 0.5 + 0.2
      });
    }

    let mouse = { x: -1000, y: -1000 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        // Bounce walls
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        // Mouse repulsion
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          p.x -= (dx / dist) * 2;
          p.y -= (dy / dist) * 2;
        }

        // Draw particle node
        ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`;
        ctx.font = `${p.size}px 'JetBrains Mono', monospace`;
        ctx.fillText(p.text, p.x, p.y);
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>

</html>
